publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ">=2.6.1 <3.0.0"
  go_router: ">=14.0.0 <17.0.0"
  supabase_flutter: ^2.8.0
  intl: ">=0.19.0 <0.21.0"
  google_fonts: ^6.2.1
